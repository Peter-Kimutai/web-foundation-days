
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 5 - User Directory</title>
  <script src="users.js" defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
    }

    button, input {
      padding: 10px;
      margin: 8px 0;
    }

    input {
      width: 100%;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
    }

    li {
      margin: 16px 0;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    li p {
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <h1>User Directory</h1>

  <button id="load-users">Load Users</button>

  <div>
    <label for="filter-input">Filter users by name:</label>
    <input
      type="text"
      id="filter-input"
      placeholder="Type a name..."
    >
  </div>

  <p id="status" role="status" aria-live="polite">
    Click "Load Users" to retrieve users.
  </p>

  <ul id="users-list"></ul>
</body>
</html>
